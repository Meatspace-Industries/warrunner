name: CI

on:
  push:
    branches:
      - main
      - "warrunner/**"
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-runtime:
    name: API workflow and control-plane tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true

      - name: Install Python dependencies
        working-directory: services/api
        run: uv sync --group dev

      - name: Lint
        working-directory: services/api
        run: uv run ruff check api/

      - name: Compile
        working-directory: services/api
        run: uv run python -m compileall -q api/

      - name: Targeted API tests
        working-directory: services/api
        run: |
          uv run pytest -q \
            tests/test_workflows.py::test_create_slack_thread_turn_workflow_eager_start \
            tests/test_workflows.py::test_slack_thread_turn_active_assignment_does_not_backfill_stop_history \
            tests/test_workflows.py::test_cancel_workflow_run_cancels_linked_execution \
            tests/test_agent_control_plane.py::test_cancel_execution_stops_runtime_and_clears_inflight \
            tests/test_agent_control_plane.py::test_steer_stdin_interrupts_amp_before_injecting \
            tests/test_agent_control_plane.py::test_worker_stops_session_when_cancel_requested_mid_stream \
            tests/test_agent_control_plane.py::test_worker_maps_amp_user_cancelled_error_to_cancelled

  slackbot-targeted-tests:
    name: Slackbot interface and delivery tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.28.1
          run_install: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Targeted Slackbot tests
        working-directory: services/slackbot
        run: |
          bun test \
            src/centaur/handoff.test.ts \
            src/slack/normalize.test.ts \
            src/centaur/final-delivery.test.ts

  warrunner-discord-dogfood:
    name: Warrunner Discord dogfood gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.28.1
          run_install: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v4.1.1

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install API test dependencies
        working-directory: services/api
        run: uv sync --group dev

      - name: Discordbot tests
        run: pnpm --filter discordbot test

      - name: Discordbot type check
        run: pnpm --filter discordbot check:types

      - name: Emulated Discord dogfood
        run: pnpm --filter discordbot dogfood:emulated

      - name: Discord service API config tests
        run: uv run --project services/api pytest -q services/api/tests/test_discordbot_service_config.py

      - name: Build Discordbot image
        run: docker build -f services/discordbot/Dockerfile .

      - name: Build Warrunner overlay image
        run: docker build -f meatspace/overlay/Dockerfile meatspace/overlay

      - name: Lint Warrunner Helm values
        run: helm lint contrib/chart -f meatspace/infra/helm/values.warrunner.yaml

      - name: Render Warrunner Helm values
        run: |
          helm template warrunner contrib/chart \
            -f meatspace/infra/helm/values.warrunner.yaml \
            --namespace centaur-system > /tmp/warrunner-rendered.yaml

      - name: Assert Discordbot deployment shape
        run: |
          grep -q "app.kubernetes.io/component: discordbot" /tmp/warrunner-rendered.yaml
          grep -q "path: /health/ready" /tmp/warrunner-rendered.yaml
          if grep -q "app.kubernetes.io/component: slackbot" /tmp/warrunner-rendered.yaml; then
            echo "Slackbot should not render in the Warrunner values overlay" >&2
            exit 1
          fi
