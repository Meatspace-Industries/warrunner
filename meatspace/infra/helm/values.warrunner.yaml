# Warrunner's default Meatspace deployment shape is Discord-first: home-channel
# turns are mention-gated, and explicit bot mentions in visible Discord threads
# are allowed so work can happen where the team is already talking.

api:
  executionWorkerEnabled: true
  workflowWorkerEnabled: true
  # GitHub App installation tokens are short-lived; avoid aging them in idle pods.
  warmPoolEnabled: false
  slackEtlEnabled: false
  discordEtlEnabled: true
  discordEtlPermissionMode: category_default
  discordEtlExcludedChannelPatterns: "*founder*,*founders*,*admin*,*private*,*sensitive*,*legal*,*finance*,*bank*,*payroll*,*signatory*,*security*,*privacy*,*tos*"
  discordEtlExcludedCategoryPatterns: "*founder*,*founders*,*admin*,*private*,*sensitive*,*legal*,*finance*,*bank*,*payroll*,*signatory*,*security*,*privacy*,*tos*"
  discordEtlTypicalCategoryMinCount: 2
  discordBackfillIntervalSeconds: 60
  discordBackfillChannelBatchLimit: 20
  discordBackfillPagesPerJob: 5
  extraEnv:
    CENTAUR_DEPLOYMENT_NAME: warrunner
    CENTAUR_DISABLED_INFRA_SECRETS: OPENAI_API_KEY,anthropic-claude
    CENTAUR_REQUIRE_GITHUB_APP_AUTH: "true"
    # Keep repo-scoped turns below the GitHub App token lifetime, leaving room
    # for proxy/pod readiness waits and a safety buffer.
    GITHUB_APP_REPO_EXECUTION_HARD_TIMEOUT_S: "2400"
    GITHUB_APP_REPO_SESSION_REFRESH_MARGIN_S: "2700"
    # Cold GKE nodes can take longer than Centaur's 60s default to pull the agent image.
    KUBERNETES_SANDBOX_READY_TIMEOUT_S: "300"
    KUBERNETES_WORKFLOW_RUN_SECRET_ENV_KEYS: DISCORD_BOT_TOKEN,GITHUB_APP_ID,GITHUB_APP_INSTALLATION_ID,GITHUB_APP_PRIVATE_KEY
    WARRUNNER_ALLOWED_GITHUB_REPOS: Meatspace-Industries/dappios,Meatspace-Industries/dapp-backend,Meatspace-Industries/dappweb
    WARRUNNER_GITHUB_REPO_ALIASES: dappios=Meatspace-Industries/dappios,dapp-ios=Meatspace-Industries/dappios,ios=Meatspace-Industries/dappios,dapp-backend=Meatspace-Industries/dapp-backend,backend=Meatspace-Industries/dapp-backend,dappweb=Meatspace-Industries/dappweb,dapp-web=Meatspace-Industries/dappweb,web=Meatspace-Industries/dappweb
    # Company-brain features: GitHub PR/issue ETL into company context
    # documents, and the daily brief posted to the Warrunner home channel.
    GITHUB_ETL_ENABLED: "1"
    WARRUNNER_DAILY_BRIEF_CHANNEL_ID: "1508220472569888950"

ironProxy:
  secretSource: env

tokenBroker:
  enabled: true
  storeSource: file
  envSecretKeys:
    - OPENAI_CODEX_CLIENT_ID
  fileStore:
    enabled: true
    bootstrapSecretKeys:
      - OPENAI_CODEX_BLOB

toolServer:
  enabled: true

slackbot:
  enabled: false

discordbot:
  enabled: true
  image:
    repository: ghcr.io/meatspace-industries/warrunner-discordbot
    tag: latest
    pullPolicy: Always
  applicationId: ""
  botUserId: ""
  guildId: ""
  homeForumChannelId: ""
  homeChannelIds: ""
  intakeChannelIds: ""
  allowedRoleIds: ""
  mentionRoleIds: "1508633681919742116"
  mentionUserAliases: "meepo=1500785594068897792"
  historyLimit: 40
  requireHomeThread: true
  homeChannelMentionRequired: true

overlay:
  image:
    repository: ghcr.io/meatspace-industries/warrunner-overlay
    tag: latest
    pullPolicy: Always
    sourcePath: /overlay

sandbox:
  codexAuth:
    existingSecretName: warrunner-codex-auth
    secretKey: auth.json
  extraEnv:
    CODEX_AUTH_MODE: access_token
    WARRUNNER_RUNTIME_STATE_DIR: /var/lib/meepo

repoCache:
  enabled: false
  hostPath: /var/lib/meepo/repos
