# Warrunner's default Meatspace deployment shape uses a mention-gated Discord
# home channel. Forum-thread routing remains available when a real forum/media
# channel is configured.

api:
  executionWorkerEnabled: true
  workflowWorkerEnabled: true
  slackEtlEnabled: false
  discordEtlEnabled: true
  discordEtlPermissionMode: category_default
  discordEtlExcludedCategoryPatterns: "*founder*,*founders*,*admin*,*private*,*sensitive*,*legal*,*finance*"
  discordEtlTypicalCategoryMinCount: 2
  discordBackfillIntervalSeconds: 60
  discordBackfillChannelBatchLimit: 20
  discordBackfillPagesPerJob: 5
  extraEnv:
    CENTAUR_DEPLOYMENT_NAME: warrunner
    CENTAUR_DISABLED_INFRA_SECRETS: OPENAI_API_KEY
    # Cold GKE nodes can take longer than Centaur's 60s default to pull the agent image.
    KUBERNETES_SANDBOX_READY_TIMEOUT_S: "300"

slackbot:
  enabled: false

discordbot:
  enabled: true
  image:
    repository: ghcr.io/meatspace-industries/warrunner-discordbot
    tag: latest
    pullPolicy: Always
  applicationId: ""
  botUserId: ""
  guildId: ""
  homeForumChannelId: ""
  homeChannelIds: ""
  intakeChannelIds: ""
  allowedRoleIds: ""
  historyLimit: 40
  requireHomeThread: true
  homeChannelMentionRequired: true

overlay:
  image:
    repository: ghcr.io/meatspace-industries/warrunner-overlay
    tag: latest
    pullPolicy: Always
    sourcePath: /overlay

sandbox:
  codexAuth:
    existingSecretName: warrunner-codex-auth
    secretKey: auth.json
  extraEnv:
    WARRUNNER_RUNTIME_STATE_DIR: /var/lib/meepo

repoCache:
  enabled: false
  hostPath: /var/lib/meepo/repos
