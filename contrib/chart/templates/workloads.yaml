{{- if and .Values.discordbot.botUserId (not (hasKey $discordbotExtraEnv "DISCORD_BOT_USER_ID")) }}
            - name: DISCORD_BOT_USER_ID
              value: {{ .Values.discordbot.botUserId | quote }}
{{- end }}
{{- if and .Values.discordbot.homeForumChannelId (not (hasKey $discordbotExtraEnv "WARRUNNER_HOME_FORUM_CHANNEL_ID")) }}
            - name: WARRUNNER_HOME_FORUM_CHANNEL_ID
              value: {{ .Values.discordbot.homeForumChannelId | quote }}
{{- end }}
{{- if and .Values.discordbot.homeChannelIds (not (hasKey $discordbotExtraEnv "WARRUNNER_HOME_CHANNEL_IDS")) }}
            - name: WARRUNNER_HOME_CHANNEL_IDS
              value: {{ .Values.discordbot.homeChannelIds | quote }}
{{- end }}
{{- if and .Values.discordbot.intakeChannelIds (not (hasKey $discordbotExtraEnv "WARRUNNER_INTAKE_CHANNEL_IDS")) }}
            - name: WARRUNNER_INTAKE_CHANNEL_IDS
              value: {{ .Values.discordbot.intakeChannelIds | quote }}
